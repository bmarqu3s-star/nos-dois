<script>
/* PWA: funciona sem internet e avisa quando há versão nova */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      const ask = w => {
        if (!navigator.serviceWorker.controller) return;
        const b = document.createElement("div"); b.setAttribute("role", "status");
        b.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:120;max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;font:600 14px var(--sans);box-shadow:0 8px 24px rgba(0,0,0,.35)";
        b.innerHTML = '<span>Nova versão disponível</span><button style="min-height:40px;padding:0 14px;border:0;border-radius:8px;background:var(--accent);color:var(--on);font:700 14px var(--sans)">Atualizar</button>';
        b.querySelector("button").onclick = () => w.postMessage("skip");
        document.body.appendChild(b);
      };
      if (reg.waiting) ask(reg.waiting);
      reg.addEventListener("updatefound", () => { const w = reg.installing; if (w) w.addEventListener("statechange", () => { if (w.state === "installed") ask(w); }); });
      let done = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => { if (done) return; done = true; location.reload(); });
    }).catch(() => {});
  });
}
</script>
