<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E7D4F" id="tc">
<meta name="description" content="Diário a dois de filmes e restaurantes: notas, onde e quando, e os próximos programas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nós Dois">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nós Dois — Cinema & Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" id="gf-caldeirao">
<style>
:root{
  /* tema Caldeirão */
  --bg:#FBF3DC;--surface:#FFF9E8;--surface2:#F0E4C4;--ink:#2A0F18;--muted:#6A4A52;--line:#E0CFA0;
  --film:#6E1B33;--onFilm:#FBF3DC;--filmT:#6E1B33;--food:#2E7D4F;--onFood:#FBF3DC;--foodT:#1F6A3E;
  --gold:#B9E3A0;--onGold:#2A0F18;--goldT:#1F6A3E;--danger:#B3261E;
  --chrome:#2E7D4F;--chromeInk:#FBF3DC;--chromeMuted:#C6E6CC;--chromeLine:#1E5A38;--chromeAct:#1E5A38;
  --hiBg:var(--surface);--hiInk:var(--ink);--hiB:2px solid #6E1B33;--hiSh:4px 4px 0 #6E1B33;
  --r:14px;--rb:12px;--rc:999px;--ri:12px;--pr:var(--r);--cardb:2px solid #6E1B33;--cardsh:4px 4px 0 #6E1B33;
  --emc:#6E1B33;--navOn:#FBF3DC;--bdgBg:#FBF3DC;--bdgInk:#6E1B33;
  --tw:800;--tt:none;--ti:normal;--track:-.03em;--showT:#8A5A00;--onShow:#FFF7E0;
  --accent:var(--film);--accT:var(--filmT);--on:var(--onFilm);
  --serif:'Bricolage Grotesque',system-ui,sans-serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(52px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
html,body{margin:0;max-width:100%;overflow-x:clip}
.toolbar>*,.stats>*,.grid>*{min-width:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;min-height:100%;-webkit-font-smoothing:antialiased}
body[data-sec="filmes"]{--accent:var(--film);--accT:var(--filmT);--on:var(--onFilm)}
body[data-sec="rest"]{--accent:var(--food);--accT:var(--foodT);--on:var(--onFood)}
body[data-sec="eventos"]{--accent:var(--showT);--accT:var(--showT);--on:var(--onShow)}
body[data-sec="agenda"],body[data-sec="ajustes"]{--accent:var(--gold);--accT:var(--goldT);--on:var(--onGold)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:var(--tw);letter-spacing:var(--track);text-transform:var(--tt);margin:0}
h1{font-size:30px;line-height:1.1}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
:focus-visible{outline:2px solid var(--accT);outline-offset:2px}

/* shell */
.top{position:sticky;top:0;z-index:40;background:var(--chrome);color:var(--chromeInk);border-bottom:1px solid var(--chromeLine);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--serif);font-size:22px;display:flex;align-items:center;gap:10px;line-height:1}
.bsym{display:flex;align-items:center}
.bwm em{font-style:var(--ti);font-weight:500;color:var(--emc)}
.top .sec{font-size:13px;color:var(--chromeMuted)}
.side{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;transform:translate3d(0,0,0);-webkit-transform:translate3d(0,0,0);z-index:40;background:var(--chrome);border-top:1px solid var(--chromeLine);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button,.side button.nv{background:none;border:0;color:var(--chromeMuted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:6px 2px;border-radius:12px}
.nav button[aria-current="page"]{color:var(--navOn)}
main{padding:18px 16px calc(130px + env(safe-area-inset-bottom,0px));max-width:1240px;margin:0 auto}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:45;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on);box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.fab[hidden]{display:none}
.desk{display:none}

/* botões e campos */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:var(--rb);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.sm{padding:7px 12px;font-size:13px;min-height:36px}
.link{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:2px 4px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--ri);padding:11px 12px}
textarea{resize:vertical;min-height:84px}
input[type=range]{width:100%;accent-color:var(--accT)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{margin-bottom:14px}

/* cabeçalho / barra */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.seg{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 14px;border-radius:var(--rc);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.chip b{font-weight:700;opacity:.8;margin-left:4px}
.tb-right{display:flex;flex-wrap:wrap;gap:10px;flex:1 1 260px}
.tb-right input{flex:1 1 140px;min-width:0}
.tb-right select{width:auto;max-width:170px}

/* cartões */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.grid.rest{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{position:relative;border-radius:var(--pr);overflow:hidden;background:var(--surface2);cursor:pointer;border:var(--cardb);box-shadow:var(--cardsh);transition:transform .2s cubic-bezier(.2,.8,.2,1);isolation:isolate}
.card:hover{transform:translateY(-3px)}
.poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}
.card.k-rest .poster{aspect-ratio:4/3}
.card.k-show .poster{aspect-ratio:4/5}
.grid.show{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.ph{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);font-family:var(--serif);font-size:44px;font-weight:var(--tw)}
.ph svg{position:absolute;opacity:.12;width:64%;height:auto}
.cap{position:absolute;inset:auto 0 0 0;padding:34px 10px 10px;background:linear-gradient(to top,rgba(10,6,3,.92),rgba(10,6,3,.55) 55%,transparent);color:#fff}
.cap b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--serif);font-weight:var(--tw);font-size:15px;line-height:1.2}
.cap small{display:block;opacity:.8;font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* selos de nota (um estilo por tema) */
.badge{position:absolute;top:6px;left:6px;z-index:2;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:var(--bdgInk);background:var(--bdgBg);line-height:1}
.b-moonpill{gap:5px;padding:4px 10px 4px 6px;border-radius:999px;font-size:15px}
.b-stamp{width:34px;height:34px;border:1.5px solid var(--bdgInk);border-radius:2px;font-size:15px}
.b-ring{width:38px;height:38px;border:1px solid var(--bdgInk);border-radius:50%;font-style:italic;font-weight:500;font-size:16px;backdrop-filter:blur(2px)}
.b-circle{width:36px;height:36px;border:1px solid var(--bdgInk);border-radius:50%;font-size:14px}
.b-seal{width:42px;height:42px;border:3px double var(--bdgInk);border-radius:50%;font-size:13px}
.b-acid{padding:5px 10px;border-radius:999px;font-family:var(--sans);font-size:13px}
.b-arc{top:0;left:10px;padding:6px 12px 5px;border-radius:0 0 12px 12px;font-size:14px}
.b-big{background:transparent;color:#fff;font-size:34px;text-shadow:0 2px 10px rgba(0,0,0,.7);top:4px;left:8px;align-items:flex-end}
.b-big small{font-size:11px;opacity:.75;margin-left:2px;font-weight:500}
.b-sticker{width:42px;height:42px;border:2px solid var(--bdgInk);border-radius:50%;transform:rotate(-10deg);font-family:var(--sans);font-weight:800;font-size:13px}
.b-moonsticker{width:46px;height:46px;border:2px solid var(--bdgInk);border-radius:50%;transform:rotate(-8deg);flex-direction:column;gap:2px;font-family:var(--sans);font-weight:800;font-size:12px;box-shadow:2px 2px 0 var(--bdgInk)}
.b-under{background:transparent;color:#fff;top:auto;bottom:10px;left:auto;right:10px;font-style:italic;font-size:22px;font-weight:500}
.badge.none{width:32px;height:32px;border-radius:50%;background:rgba(10,6,3,.7);border:1.5px dashed rgba(255,255,255,.7);color:#fff;padding:0;font-size:14px;font-style:normal;transform:none;box-shadow:none;backdrop-filter:none;top:6px;left:6px;bottom:auto;right:auto}
.badge.wish{width:32px;height:32px;border-radius:50%;background:rgba(10,6,3,.7);color:#fff;transform:none;box-shadow:none}
.lbchip{position:absolute;top:8px;right:8px;background:rgba(10,6,3,.72);color:#fff;border-radius:6px;font-size:11px;font-weight:700;padding:3px 7px;z-index:2}
.scroller{display:flex;gap:16px;overflow-x:auto;padding:4px 6px 12px 4px;scroll-snap-type:x proximity}
.scroller .card{flex:0 0 140px;scroll-snap-align:start}
.scroller .card.k-rest{flex-basis:220px}
.scroller .card.k-show{flex-basis:170px}
.more{display:flex;justify-content:center;margin-top:22px}

/* início */
.hero{margin:6px 0 22px}
.hsym{margin-bottom:14px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.hero h1 em{font-style:var(--ti);color:var(--emc)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .n{font-family:var(--serif);font-size:32px;font-weight:var(--tw);line-height:1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.stat.film .n{color:var(--filmT)}.stat.food .n{color:var(--foodT)}.stat.show .n{color:var(--showT)}
.panel{background:var(--hiBg);color:var(--hiInk);border:var(--hiB);box-shadow:var(--hiSh);border-radius:var(--r);padding:16px;margin-bottom:22px}
.panel .muted,.panel .eyebrow{color:inherit;opacity:.72}
.panel.cta{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.empty{text-align:center;padding:48px 20px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.empty h2{margin-bottom:8px}
.empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.steps{counter-reset:s;list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:14.5px}
.steps li::before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;background:var(--gold);color:var(--onGold);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}

/* agenda */
.mon{font-family:var(--serif);font-weight:var(--tw);font-size:18px;margin:22px 0 10px;text-transform:capitalize}
.plan{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--filmT);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;cursor:pointer}
.plan.k-rest{border-left-color:var(--foodT)}
.plan.k-show{border-left-color:var(--showT)}
.plan.late{background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
.dt{flex:0 0 52px;text-align:center;line-height:1}
.dt b{display:block;font-family:var(--serif);font-weight:var(--tw);font-size:24px}
.dt span{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.thumb{flex:0 0 46px;width:46px;height:62px;border-radius:calc(var(--r) / 2);object-fit:cover;background:var(--surface2)}
.thumb.ph{font-size:18px;position:relative;overflow:hidden}
.thumb.ph svg{display:none}
.plan .info{flex:1;min-width:0}
.plan .info b{display:block;font-family:var(--serif);font-weight:var(--tw);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan .info small{color:var(--muted);font-size:12.5px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--filmT) 16%,transparent);color:var(--filmT);margin-right:6px}
.tag.rest{background:color-mix(in srgb,var(--foodT) 16%,transparent);color:var(--foodT)}
.tag.show{background:color-mix(in srgb,var(--showT) 18%,transparent);color:var(--showT)}
.two{display:grid;gap:18px}
.agw{max-width:860px}
.plan{gap:10px;padding:10px}
.plan .dt{flex-basis:44px}
.plan .info b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}
.plan .info small{display:block;margin-top:3px;line-height:1.35}
.plan .btn.sm{flex:0 0 auto;padding:7px 11px;min-height:36px}
.plan .thumb{flex-basis:40px;width:40px;height:56px}
.agbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:16px}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calh h3,.mon.dd{text-transform:none;font-size:19px}
.calh h3::first-letter,.mon.dd::first-letter{text-transform:uppercase}
.calh .nv{display:flex;gap:6px}
.calh .btn.sm{min-height:36px;padding:6px 12px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cwd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
.cgrid.dd{grid-auto-rows:54px}
.cd{position:relative;height:100%;overflow:hidden;border:1px solid transparent;border-radius:calc(var(--r) + 2px);background:color-mix(in srgb,var(--surface2) 35%,transparent);padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink);text-align:center}
.cd.cdo{opacity:.38}
.cd.today b{background:var(--accent);color:var(--on)}
.cd[aria-pressed="true"]{border-color:var(--accT);background:color-mix(in srgb,var(--accT) 14%,var(--surface))}
.cd b{font-size:13px;font-weight:700;min-width:22px;height:22px;line-height:22px;border-radius:999px}
.cdots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.cdot{width:7px;height:7px;border-radius:50%;background:var(--filmT);box-sizing:border-box}
.cdot.r{background:var(--foodT)}
.cdot.q{background:transparent;border:1.5px solid var(--filmT)}
.cdot.q.r{border-color:var(--foodT)}
.cdot.s{background:var(--showT)}
.cdot.q.s{background:transparent;border-color:var(--showT)}
.ctt{display:none}
.cleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.cleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--filmT)}
.cleg i.r{background:var(--foodT)}.cleg i.s{background:var(--showT)}.cleg i.q{background:transparent;border:1.5px solid var(--filmT)}
@media (min-width:700px){
  .cgrid.dd{grid-auto-rows:96px}
  .cd{align-items:stretch;text-align:left;padding:5px 6px}
  .cd b{align-self:flex-start}
  .cdots{display:none}
  .ctt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .ctt span{font-size:11.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--filmT);padding-left:4px;color:var(--ink)}
  .ctt span.r{border-left-color:var(--foodT)}
  .ctt span.s{border-left-color:var(--showT)}
  .ctt span.q{opacity:.75;font-style:italic}
  .ctt em{font-size:11px;color:var(--muted);font-style:normal}
}
#attv{position:fixed;inset:0;z-index:110;background:#0d0d0d;color:#fff;display:flex;flex-direction:column}
#attv[hidden]{display:none}
.av-top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:#161616;border-bottom:1px solid #2a2a2a}
.av-top b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.av-top b small{display:block;font-weight:500;color:#aaa;font-size:12px}
.av-top .btn{min-height:40px;min-width:40px;padding:6px 12px;background:#262626;border-color:#3a3a3a;color:#fff}
.av-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;background:#0d0d0d}
.av-body img,.av-body canvas{display:block;margin:0 auto 10px;height:auto;max-width:none;background:#fff}
.av-msg{padding:40px 24px 16px;text-align:center;color:#ccc}
.av-body .btn{display:flex;margin:8px auto;background:#262626;border-color:#3a3a3a;color:#fff}
.av-nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:#161616;border-top:1px solid #2a2a2a}
.av-nav .chip{background:#262626;border-color:#3a3a3a;color:#ddd}
.av-nav .chip[aria-pressed="true"]{background:var(--showT);border-color:var(--showT);color:var(--onShow)}
.attbox{margin-bottom:14px}
.attrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.attrow .attic{color:var(--showT);display:flex}
.attrow .attn{flex:1;min-width:0;text-align:left;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:6px 0}
.attrow .x{width:32px;height:32px;flex:0 0 32px}
.attbox .btn.sm{margin-top:8px}
.panel.cta.evd{border-left:5px solid var(--showT)}
.panel.cta.evd .btnrow{justify-content:flex-start}
.wantbtn{position:absolute;top:6px;left:6px;z-index:3;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);background:rgba(10,6,3,.62);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;-webkit-tap-highlight-color:transparent}
.wantbtn.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.wantbtn.on svg{fill:currentColor}

/* modal */
.ov{position:fixed;inset:0;z-index:80;background:rgba(10,6,3,.6);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.ov[hidden]{display:none}

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

const safeUrl = u => {
  const s = String(u || "").trim();
  if (!s) return "";
  try {
    const parsed = new URL(s);
    return (parsed.protocol === "https:" || parsed.protocol === "http:") ? parsed.href : "";
  } catch (e) {
    return "";
  }
};

const hash = s => {
  let h = 7;
  for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h;
};

const fmt = n => (n % 1 ? n.toFixed(1) : String(n)).replace(".", ",");
const pad = n => String(n).padStart(2, "0");
const isoDate = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayStr = () => isoDate(new Date());
const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => s ? toDate(s).toLocaleDateString("pt-BR") : "";
const firstDir = d => d ? d.split(",")[0].trim() + (d.includes(",") ? " e outros" : "") : "";
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

function coupleAvg(ra, rb) {
  return ra != null && rb != null ? Math.round(((ra + rb) / 2) * 100) / 100 : null;
}

function coupleSync(it) {
  const m = coupleAvg(it.ra, it.rb);
  if (m != null) it.rating = m;
  return it;
}

const isWant = i => i.kind === "filme" && i.status === "quero" && !!(i.want || i.date);

const KUI = { filme: "filmes", rest: "rest", show: "shows" };
const KOF = { filmes: "filme", rest: "rest", shows: "show" };
const KNAME = { filme: "Filme", rest: "Restaurante", show: "Evento" };
const kc = i => i.kind === "filme" ? "film" : i.kind === "show" ? "show" : "rest";
const kcs = i => i.kind === "rest" ? "r" : i.kind === "show" ? "s" : "";
const kIcon = k => k === "filme" ? "film" : k === "show" ? "music" : "fork";
const ETYPES = ["Festival", "Rave", "Show", "Balada", "Outro"];

const costN = i => {
  let s = String(i.cost || "").replace(/[^\d.,]/g, "");
  if (!s) return 0;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};

const brl = n => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: n % 1 ? 2 : 0 });
const dayDiff = d => Math.round((toDate(d) - toDate(todayStr())) / 864e5);
const fmtRange = i => !i.date ? "" : i.dateEnd && i.dateEnd > i.date ? (i.date.slice(0, 7) === i.dateEnd.slice(0, 7) ? pad(toDate(i.date).getDate()) + "–" + fmtDate(i.dateEnd) : fmtDate(i.date) + " – " + fmtDate(i.dateEnd)) : fmtDate(i.date);
const ticketTxt = t => t === "comprado" ? "ingresso ok" : t === "pendente" ? "falta ingresso" : "";

const keyOf = (t, y) => norm(t) + "|" + (y || "");
const stripHtml = s => s.replace(/<br\s*\/?>/gi, "\n").replace(/<\/p>/gi, "\n").replace(/<[^>]+>/g, "").trim();

function parseCSV(t) {
  t = String(t || "").replace(/^\uFEFF/, "");
  const rows = [];
  let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(f); f = ""; rows.push(row); row = []; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  if (!rows.length) return [];
  const h = rows.shift().map(x => x.trim().toLowerCase());
  return rows.filter(r => r.some(x => x !== "")).map(r => {
    const o = {};
    h.forEach((k, i) => { o[k] = (r[i] || "").trim(); });
    return o;
  });
}

const priceN = p => (String(p || "").match(/\$/g) || []).length;

const OH_D = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
const OH_PT = { seg: "Mo", segunda: "Mo", ter: "Tu", terca: "Tu", qua: "We", quarta: "We", qui: "Th", quinta: "Th", sex: "Fr", sexta: "Fr", sab: "Sa", sabado: "Sa", dom: "Su", domingo: "Su" };

function ohNorm(raw) {
  let s = String(raw || "").trim();
  if (!s) return "";
  s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[–—]/g, "-");
  s = s.replace(/\b(segunda|terca|quarta|quinta|sexta|sabado|domingo|seg|ter|qua|qui|sex|sab|dom)\b/gi, m => OH_PT[m.toLowerCase()]);
  s = s.replace(/\bfechado\b/gi, "off").replace(/\b24 ?h(oras)?\b/gi, "00:00-24:00").replace(/\b(\d{1,2})h(\d{2})?\b/gi, (m, h, mi) => pad(+h) + ":" + (mi || "00")).replace(/\bas\b/gi, "-").replace(/\be\b/gi, ",");
  return s.replace(/\s*-\s*/g, "-").replace(/\s*,\s*/g, ",").trim();
}

function parseOH(raw) {
  let s = ohNorm(raw);
  if (!s) return null;
  if (/^24\/7$/i.test(s)) s = "Mo-Su 00:00-24:00";
  const days = Array(7).fill(null), idx = d => OH_D.indexOf(d);
  let any = false;
  for (let rule of s.split(/;|\n/)) {
    rule = rule.trim();
    if (!rule) continue;
    if (/^PH\b/i.test(rule)) continue;
    if (/PH|SH|sunrise|sunset|week|\[|\+|\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/i.test(rule)) return null;
    const m = rule.match(/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?,?)+)?\s*(.*)$/);
    if (!m) return null;
    const dp = (m[1] || "").replace(/,$/, ""), tp = (m[2] || "").trim();
    let set = [];
    if (!dp) set = [0, 1, 2, 3, 4, 5, 6];
    else {
      for (const seg of dp.split(",")) {
        const r = seg.split("-"), a = idx(r[0]);
        if (a < 0) return null;
        if (r.length === 1) set.push(a);
        else {
          const b = idx(r[1]);
          if (b < 0) return null;
          let x = a;
          for (let k = 0; k < 8; k++) { set.push(x); if (x === b) break; x = (x + 1) % 7; }
        }
      }
    }
    const iv = [];
    if (!/^(off|closed)$/i.test(tp)) {
      for (const t of tp.split(",")) {
        const q = t.trim().match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/);
        if (!q) return null;
        const a = +q[1] * 60 + +q[2];
        let b = +q[3] * 60 + +q[4];
        if (b <= a) b += 1440;
        iv.push([a, b]);
      }
    }
    for (const d of set) days[d] = iv;
    any = true;
  }
  return any ? days : null;
}

function ohState(raw, now = new Date()) {
  const d = parseOH(raw);
  if (!d) return { known: false };
  const dow = now.getDay(), min = now.getHours() * 60 + now.getMinutes();
  const hm = x => x === 1440 ? "24:00" : pad(Math.floor(x / 60) % 24) + ":" + pad(x % 60);
  let open = false, until = null;
  for (const [a, b] of (d[dow] || [])) if (min >= a && min < b) { open = true; until = b; }
  for (const [a, b] of (d[(dow + 6) % 7] || [])) if (b > 1440 && min < b - 1440) { open = true; until = b - 1440; }
  const today = (d[dow] || []), txt = today.length ? today.map(([a, b]) => hm(a) + "–" + hm(b > 1440 ? b - 1440 : b)).join(" e ") : "fechado hoje";
  const nxt = !open && today.find(([a]) => a > min);
  return { known: true, open, until: until != null ? hm(until) : "", today: txt, opens: nxt ? hm(nxt[0]) : "" };
}

const syHash = str => {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36);
};
const sigOf = it => syHash(JSON.stringify(it));
const imgSig = d => d.length + ":" + syHash(d.slice(0, 64) + d.slice(-64));
const syncable = i => !((i.imp || i.impOsm || i.src === "catalogo") && !i.edited && !i.want && i.status === "quero" && !i.date);
const idKey = i => i.osm ? "osm|" + i.osm.id : i.kind + "|" + norm(i.title) + "|" + (i.kind === "filme" ? i.year : i.kind === "show" ? i.date : norm(i.where));

function fillMissing(r, dup) {
  const empty = v => v == null || v === "";
  ["ra", "rb", "rating", "date", "where", "notes", "dishes", "price"].forEach(k => { if (empty(r[k]) && !empty(dup[k])) r[k] = dup[k]; });
  if (dup.status === "visto" && r.status === "quero") r.status = "visto";
  if ((dup.att || []).length) r.att = [...(r.att || []), ...dup.att.filter(x => !(r.att || []).some(y => y.id === x.id))];

function osmCuisine(t) {
  const list = [];
  (t.cuisine || "").split(/[;,]/).map(x => x.trim().toLowerCase().replace(/\s+/g, "_")).filter(Boolean).forEach(x => {
    const m = OSM_CUIS[x] || (x[0].toUpperCase() + x.slice(1).replace(/_/g, " "));
    if (!list.includes(m)) list.push(m);
  });
  return list.length ? list.slice(0, 2).join(", ") : (OSM_DEF[t.amenity] || "");
}

let imBusy = false, imStop = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function imRun() {
  if (!TMDBKEY) return imOut("Cole primeiro a chave da API do TMDB (cartão abaixo).");
  if (imBusy) return;
  imBusy = true; imStop = false;
  const limit = ui.imf.n === "all" ? Infinity : parseInt(ui.imf.n, 10), wantPoster = !!ui.imf.p, batch = "imp-" + Date.now();
  let page = 1, total = 1, skipped = 0, done = 0, fail = 0, posters = 0, idx = 0; const found = [];
  try {
    while (!imStop && page <= Math.min(total, 500) && found.length < limit) {
      const r = await tmdbGet("/discover/movie", imParams(page), true);
      total = r.total_pages || 1;
      for (const m of r.results || []) { if (found.length >= limit) break; if (tmFind(m)) skipped++; else if (!found.some(x => x.id === m.id)) found.push(m); }
      imOut(`Listando… página ${page} de ${Math.min(total, 500)}: ${found.length} novos, ${skipped} já na lista.`);
      page++;
    }
    S.lastImp = batch;
    const worker = async () => {
      while (!imStop) {
        const m = found[idx++]; if (!m) return;
        for (let t = 0; t < 3; t++) {
          try {
            const d = await tmdbGet("/movie/" + m.id, { append_to_response: "credits,videos,release_dates,watch/providers,keywords,external_ids", include_video_language: "pt,en" }, true);
            const it = newItem("filme", { title: d.title || m.title || "", orig: d.original_title || m.original_title || "", year: (d.release_date || m.release_date || "").slice(0, 4), status: "quero", src: "tmdb", imp: batch });

            const pp = d.poster_path || m.poster_path;
            if (wantPoster && pp) { try { const blob = await (await fetch(TMI + "w342" + pp)).blob(); setImg(it.id, await resizeImage(blob, 520, 0.72)); posters++; } catch (e) { } }
            done++; break;
          } catch (e) { if (t === 2 || /401/.test(e.message || "")) { fail++; break; } await sleep(1200); }
        }
        if ((done + fail) % 10 === 0) { imOut(`Importando… ${done + fail} de ${found.length} (${done} ok${fail ? ", " + fail + " com erro" : ""}).`); save(); }
      }
    };
    await Promise.all(Array.from({ length: 5 }, worker));
    save();
    imOut(`<b>${imStop ? "Interrompido" : "Concluído"}.</b> ${done} filmes importados com ficha completa${wantPoster ? `, ${posters} pôsteres` : ""}${skipped ? `, ${skipped} já estavam na lista` : ""}${fail ? `, ${fail} com erro` : ""}.`);
    render();

  imBusy = false;
}

}

  if (t.id === "f_hr") { hrHint(); return; }
  if (t.id === "f_title" && e.inputType === "insertReplacementText") { setTimeout(placeAutofill, 0); return; }
  if (t.dataset.rbairro !== undefined || t.dataset.rcuis !== undefined) { if (t.dataset.rbairro !== undefined) ui.rest.bairro = t.value; else ui.rest.cuis = t.value; ui.rest.n = 60; $("#list").innerHTML = listHTML("rest"); return; }
  if (t.dataset.fdir !== undefined || t.dataset.fcast !== undefined) { if (t.dataset.fdir !== undefined) ui.filmes.dir = t.value; else ui.filmes.cast = t.value; ui.filmes.n = 60; $("#list").innerHTML = listHTML("filme"); return; }
  if (t.dataset.sart !== undefined) { ui.shows.art = t.value; ui.shows.n = 60; $("#list").innerHTML = listHTML("show"); return; }
  if (t.dataset.txq !== undefined && TX) { TX.q = t.value; clearTimeout(txT); txT = setTimeout(() => { TX.detail = null; TX.person = null; txLoad(true); }, 450); return; }
  if (t.dataset.q) { const u = ui[t.dataset.q]; u.q = t.value; u.n = 60; $("#list").innerHTML = listHTML(KOF[t.dataset.q]); }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.stype !== undefined) { ui.shows.t = t.value; ui.shows.n = 60; $("#list").innerHTML = listHTML("show"); return; }
  if (t.dataset.syear !== undefined) { ui.shows.y = t.value; ui.shows.n = 60; $("#list").innerHTML = listHTML("show"); return; }
  if (t.dataset.rk) { ui.rk[t.dataset.rk] = t.value; ui.rk.n = 10; render(); return; }
  if (t.dataset.sg) { ui.sg[t.dataset.sg] = t.value; ui.sg.n = 12; render(); return; }
  if (t.id === "f_title" && ED && ED.it.kind === "rest" && ED.isNew) { setTimeout(placeAutofill, 0); return; }
  if (t.id === "f_hr") { hrHint(); return; }
  if (t.dataset.genre) { ui.filmes.g = t.value; ui.filmes.n = 60; $("#list").innerHTML = listHTML("filme"); return; }
  if (t.dataset.sycode !== undefined) { SY.code = t.value; return; }
  if (t.dataset.osf) { ui.osf[t.dataset.osf] = t.checked ? "1" : ""; return; }
  if (t.dataset.imf) { ui.imf[t.dataset.imf] = t.type === "checkbox" ? (t.checked ? "1" : "") : t.value.trim(); return; }
  if (t.dataset.txf && TX) { TX.f[t.dataset.txf] = t.type === "checkbox" ? (t.checked ? "1" : "") : t.value; return; }
  if (t.id === "tkey") { TMDBKEY = t.value.trim(); dbWrite("kv", st => st.put(TMDBKEY, "tmdbKey")); return; }
  if (t.dataset.sort) { const u = ui[t.dataset.sort]; u.sort = t.value; u.n = 60; $("#list").innerHTML = listHTML(KOF[t.dataset.sort]); return; }
  if (t.id === "nA" || t.id === "nB") { S.names = [$("#nA").value.trim() || "Eu", $("#nB").value.trim() || "Ela"]; save(); renderShell(); return; }
  if (t.dataset.att && t.files && t.files.length && ED) {
    const ty = t.dataset.att; readForm();
    for (const f of [...t.files]) {
      try { const r = await attRead(f, ty); const a = { id: uid(), t: ty, n: (f.name || "").replace(/\.[^.]+$/, "").slice(0, 40) || (ty === "lineup" ? "Line-up" : "Ingresso"), m: r.m, c: Math.ceil(r.d.length / ACH) }; attSave(a.id, r.d); ED.it.att = [...(ED.it.att || []), a]; if (r.m === "application/pdf") warmPdf(); } catch (err) { toast((err && err.message) || "Não consegui anexar"); }
    }
    t.value = ""; drawEditor(); return;
  }
  if (!t.files || !t.files.length) return;
  const files = [...t.files]; t.value = "";
  if (t.id === "fLB") { ui.imp = "Importando…"; render(); await handleImport(files); }
  else if (t.id === "fPst") { ui.pst = "Processando imagens…"; render(); await handlePosters(files); }
  else if (t.id === "fRs") await restoreBackup(files[0]);
  else if (t.id === "fPh") {
    try { readForm(); const d = await resizeImage(files[0]); ED.photo = d; ED.preview = d; drawEditor(); } catch (err) { toast("Não consegui ler essa imagem"); }
  }
});

/* ---------- início ---------- */
(async function init() {
  await loadAll();
  if (S.items.some(i => (i.att || []).some(a => a.m === "application/pdf"))) setTimeout(warmPdf, 2500);
  let cat = null;
  if (!S.catalogV) cat = loadCatalog();
  applyTheme();
  syBoot();
  if (cat) setTimeout(() => toast(`Catálogo carregado: ${cat.created} filmes em “Quero ver”`), 700);
})();

</script>
<script>
/* PWA: funciona sem internet e avisa quando há versão nova */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      const ask = w => {
        if (!navigator.serviceWorker.controller) return;
        const b = document.createElement("div"); b.setAttribute("role", "status");
        b.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:120;max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;font:600 14px var(--sans);box-shadow:0 8px 24px rgba(0,0,0,.35)";
        b.innerHTML = '<span>Nova versão disponível</span><button style="min-height:40px;padding:0 14px;border:0;border-radius:8px;background:var(--accent);color:var(--on);font:700 14px var(--sans)">Atualizar</button>';
        b.querySelector("button").onclick = () => w.postMessage("skip");
        document.body.appendChild(b);
      };
      if (reg.waiting) ask(reg.waiting);
      reg.addEventListener("updatefound", () => { const w = reg.installing; if (w) w.addEventListener("statechange", () => { if (w.state === "installed") ask(w); }); });
      let done = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => { if (done) return; done = true; location.reload(); });
    }).catch(() => {});
  });
}
</script>
